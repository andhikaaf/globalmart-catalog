version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
  pre_build:
    commands:
      - npm ci
  build:
    commands:
      - npm run build
  post_build:
    commands:
      - chmod +x scripts/*.sh

artifacts:
  files:
    - 'build/**/*'
    - appspec.yml
    - 'scripts/**/*'
    - 'deploy/**/*'